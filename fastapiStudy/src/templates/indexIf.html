<!doctype html>
<html lang="en">
<head>
    <title>FastAPI & Jinja2 with Safe Filter</title>
</head>
<body>
    {% if time_of_day == "morning" %}
        <h1>Good Morning!</h1>
    {% elif time_of_day == "afternoon" %}
        <h1>Good Afternoon!</h1>
    {% else %}
        <h1>Good Evening</h1>
    {% endif %}
</body>
</html>
